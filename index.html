## 4. PATTERN E CLUSTER ANALYSIS

### 4.1 Cluster Identificati

**Cluster 1: "Big Three" Dominance**
- Membri: Vanguard, BlackRock, State Street
- Caratteristica: Presente simultaneamente nei top 3 di ogni società
- Ownership combinata tipica: 17-22% per società
- Pattern: Passive investing / Index funds

**Cluster 2: "Founders Control"**
- Membri: Larry Ellison (Oracle), Mark Zuckerberg (Meta), Elon Musk (Tesla)
- Caratteristica: Ownership individuale > 10%
- Pattern: Controllo strategico della società

**Cluster 3: "Secondary Institutional"**
- Membri: Fidelity, Geode Capital, T. Rowe Price, Capital World
- Caratteristica: Presente in subset delle società (50-80% copertura)
- Ownership tipica: 1-6% per società

### 4.2 Network Density (Densità della Rete)

**Formula:** Density = 2E / [N(N-1)]
- E (edges) = 52
- N (nodes) = 23
- Density = (2 × 52) / [23 × 22] = 104 / 506 = **0.205 (20.5%)**

**Interpretazione:** La rete ha una densità moderata-bassa, indicando connessioni selettive piuttosto che saturazione completa.

## 7. VULNERABILITÀ E RISCHI SISTEMICI

### 7.1 Concentrazione del Rischio

**Single Point of Failure Analysis:**

Se Vanguard o BlackRock dovessero liquidare posizioni:
- Impatto su TUTTE le 10 società simultaneamente
- Rischio sistemico per l'intero settore tech
- Combined ownership VAN+BLK: ~15-17% di ogni società

### 7.2 Network Resilience

**Scenario Analysis:**

1. **Rimozione di 1 investitore istituzionale:**
   - Network rimane connesso (grazie a ridondanza)
   - Minimal impact su connectivity

2. **Rimozione di "Big Three" simultaneamente:**
   - Network significativamente frammentato
   - Perdita di 17-22% ownership per società
   - Impatto critico su liquidità e governance

---

## 8. INSIGHTS E CONCLUSIONI

### 8.1 Pattern Dominanti

**"Big Three" Hegemony:**
- Vanguard, BlackRock, State Street controllano ~17-22% di ogni società tech
- Passive investing crea ownership structure omogenea
- Potenziale per coordinamento implicito nelle decisioni di governance

**Dual Structure:**
- Mature tech (MSFT, AAPL, GOOG, AMZN): dominanza istituzionale
- Founder-led tech (META, TSLA, ORCL): ownership mista

### 8.2 Implicazioni per la Governance

**Voting Power:**
- "Big Three" hanno collective voting power significativo
- Potenziale influenza su decisioni strategiche, board composition, ESG policies

**Allineamento di Interessi:**
- Index funds tendono a voting patterns simili
- Minore diversità nelle preferenze degli azionisti

                });
              })
              .on('mouseout', function() {
                d3.select(this).transition().duration(200).attr('stroke-width', 3).attr('stroke', '#fff');
                link.style('stroke-opacity', 0.6);
                node.style('opacity', 1);
              });

            const label = svg.append('g').selectAll('text').data(nodes).join('text')
              .text(d => d.name)
              .attr('font-size', d => d.type === 'company' ? 14 : 11)
              .attr('font-weight', d => d.type === 'company' ? 'bold' : 'normal')
              .attr('fill', '#1e293b')
              .attr('text-anchor', 'middle')
              .attr('dy', d => d.type === 'company' ? 5 + Math.sqrt(d.marketCap) * 8 : 40)
              .attr('pointer-events', 'none')
              .style('user-select', 'none');

            simulation.on('tick', () => {
              link.attr('x1', d => d.source.x).attr('y1', d => d.source.y).attr('x2', d => d.target.x).attr('y2', d => d.target.y);
              node.attr('cx', d => d.x).attr('cy', d => d.y);
              label.attr('x', d => d.x).attr('y', d => d.y);
            });

            function drag(simulation) {
              function dragstarted(event) {
                if (!event.active) simulation.alphaTarget(0.3).restart();
                event.subject.fx = event.subject.x;
                event.subject.fy = event.subject.y;
              }
              function dragged(event) {
                event.subject.fx = event.x;
                event.subject.fy = event.y;
              }
              function dragended(event) {
                if (!event.active) simulation.alphaTarget(0);
                event.subject.fx = null;
                event.subject.fy = null;
              }
              return d3.drag().on('start', dragstarted).on('drag', dragged).on('end', dragended);
            }
          }, []);

          return (
            <div className="w-full">
              <div className="grid grid-cols-4 gap-4 mb-6">
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-2xl font-bold text-blue-600">10</div>
                  <div className="text-sm text-slate-600">Società Tech</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-2xl font-bold text-green-600">7</div>
                  <div className="text-sm text-slate-600">Investitori Istituzionali</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-2xl font-bold text-amber-600">6</div>
                  <div className="text-sm text-slate-600">Investitori Individuali</div>
                </div>
                <div className="bg-white rounded-lg shadow p-4">
                  <div className="text-2xl font-bold text-purple-600">$24.8T</div>
                  <div className="text-sm text-slate-600">Market Cap Totale</div>
                </div>
              </div>

              <div className="grid grid-cols-3 gap-4 mb-6">
                <div className="bg-white rounded-lg shadow p-4">
                  <h3 className="font-semibold text-slate-800 mb-3">Legenda Nodi</h3>
                  <div className="space-y-2 text-sm">
                    <div className="flex items-center gap-2">
                      <div className="w-5 h-5 rounded-full bg-gradient-to-br from-blue-500 to-blue-700"></div>
                      <span className="text-slate-700">Società Tecnologiche</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="w-5 h-5 rounded-full bg-gradient-to-br from-green-500 to-green-700"></div>
                      <span className="text-slate-700">Investitori Istituzionali</span>
                    </div>
                    <div className="flex items-center gap-2">
                      <div className="w-5 h-5 rounded-full bg-gradient-to-br from-amber-500 to-amber-700"></div>
                      <span className="text-slate-700">Investitori Individuali</span>
                    </div>
                  </div>
                </div>

                <div className="bg-white rounded-lg shadow p-4">
                  <h3 className="font-semibold text-slate-800 mb-3">Pattern Dominanti</h3>
                  <div className="space-y-1 text-sm text-slate-700">
                    <div>🥇 Vanguard: #1 in tutte le 10 società</div>
                    <div>🥈 BlackRock: #2 in 9 su 10 società</div>
                    <div>🥉 State Street: sempre nei top 4</div>
                    <div>📊 Concentrazione: "Big Three"</div>
                  </div>
                </div>

                <div className="bg-white rounded-lg shadow p-4">
                  <h3 className="font-semibold text-slate-800 mb-3">Insights Chiave</h3>
                  <div className="space-y-1 text-sm text-slate-700">
                    <div>💎 Larry Ellison: 40.79% Oracle</div>
                    <div>🚗 Elon Musk: 12.8% Tesla</div>
                    <div>👤 Mark Zuckerberg: 13.5% Meta</div>
                    <div>📦 Jeff Bezos: 8.29% Amazon</div>
                  </div>
                </div>
              </div>

              {selectedNode && (
                <div className="bg-gradient-to-r from-blue-50 to-indigo-50 border-2 border-blue-300 rounded-lg shadow-lg p-4 mb-6">
                  <h3 className="font-bold text-lg text-slate-800 mb-2">
                    {selectedNode.type === 'company' ? '🏢' : selectedNode.type === 'institutional' ? '🏛️' : '👤'} 
                    {' '}{selectedNode.name}
                  </h3>
                  <div className="text-sm text-slate-700">
                    {selectedNode.type === 'company' && (
                      <div><strong>Market Cap:</strong> ${selectedNode.marketCap.toFixed(2)} trillion</div>
                    )}
                    {selectedNode.type === 'institutional' && (
                      <div>Tipo: Investitore Istituzionale</div>
                    )}
                    {selectedNode.type === 'individual' && (
                      <div>Tipo: Azionista Individuale (Founder/CEO)</div>
                    )}
                  </div>
                </div>
              )}

              <div className="bg-white rounded-xl shadow-2xl p-6">
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold text-slate-800">Grafo di Proiezione</h2>
                  <div className="text-sm text-slate-600">
                    Trascina i nodi • Hover per dettagli
                  </div>
                </div>
                <div className="border-2 border-slate-200 rounded-lg overflow-hidden">
                  <svg ref={svgRef}></svg>
                </div>
              </div>

              <div className="bg-white rounded-lg shadow p-4 mt-6">
                <h3 className="font-semibold text-slate-800 mb-2">📋 Note Metodologiche</h3>
                <div className="text-sm text-slate-600 space-y-1">
                  <p>• <strong>Spessore collegamenti:</strong> proporzionale alla % di ownership</p>
                  <p>• <strong>Dimensione nodi società:</strong> proporzionale alla market capitalization</p>
                  <p>• <strong>Collegamenti tratteggiati:</strong> ownership di founders/CEOs</p>
                  <p>• <strong>Dati:</strong> 18 ottobre 2024 - SEC 13F filings Q3-Q4 2024</p>
                </div>
              </div>
            </div>
          );
        };
        
        const MarkdownReport = () => {
          const [html, setHtml] = useState('');
          
          useEffect(() => {
            const markdownContent = document.getElementById('markdown-report').textContent;
            const renderedHtml = marked.parse(markdownContent);
            setHtml(renderedHtml);
          }, []);
          
          return (
            <div className="grid grid-cols-4 gap-6">
              <div className="col-span-1">
                <div className="toc bg-white rounded-lg shadow p-4">
                  <h3 className="font-bold text-slate-800 mb-4">📑 Indice</h3>
                  <nav className="text-sm">
                    <a href="#struttura" className="block py-2">1. Struttura della Rete</a>
                    <a href="#matrice" className="block py-2">2. Matrice di Adiacenza</a>
                    <a href="#centralita" className="block py-2">3. Metriche di Centralità</a>
                    <a href="#cluster" className="block py-2">4. Cluster Analysis</a>
                    <a href="#bipartita" className="block py-2">5. Analisi Bipartita</a>
                    <a href="#potere" className="block py-2">6. Potere e Influenza</a>
                    <a href="#vulnerabilita" className="block py-2">7. Vulnerabilità</a>
                    <a href="#conclusioni" className="block py-2">8. Conclusioni</a>
                  </nav>
                </div>
              </div>
              
              <div className="col-span-3">
                <div className="bg-white rounded-xl shadow-lg p-8">
                  <div 
                    className="markdown-content"
                    dangerouslySetInnerHTML={{ __html: html }}
                  />
                </div>
              </div>
            </div>
          );
        };
        
        const App = () => {
          const [activeTab, setActiveTab] = useState('graph');
          
          return (
            <div className="w-full min-h-screen bg-gradient-to-br from-slate-50 to-slate-100 p-6">
              <div className="max-w-[1600px] mx-auto">
                <div className="bg-white rounded-xl shadow-lg p-6 mb-6">
                  <h1 className="text-4xl font-bold text-slate-800 mb-2">
                    🔗 Social Network Analysis
                  </h1>
                  <p className="text-lg text-slate-600 mb-4">
                    Top 10 Tech Companies - Analisi delle connessioni tra società e azionisti principali
                  </p>
                  
                  <div className="flex gap-2 mt-6">
                    <button
                      onClick={() => setActiveTab('graph')}
                      className={`tab-button px-6 py-3 rounded-lg font-semibold ${
                        activeTab === 'graph' ? 'active' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }`}
                    >
                      📊 Grafo Interattivo
                    </button>
                    <button
                      onClick={() => setActiveTab('report')}
                      className={`tab-button px-6 py-3 rounded-lg font-semibold ${
                        activeTab === 'report' ? 'active' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'
                      }`}
                    >
                      📄 Report Analitico
                    </button>
                  </div>
                </div>
                
                <div className="mt-6">
                  {activeTab === 'graph' && <NetworkGraph />}
                  {activeTab === 'report' && <MarkdownReport />}
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
